[env:uno_r4_minima]
platform = renesas-ra
board = uno_r4_minima
framework = arduino
monitor_speed = 115200
upload_port = /dev/serial/by-id/usb-Arduino_UNO_R4_Minima_37041A20373331392E0333324B572D48-if00
monitor_port = /dev/serial/by-id/usb-Arduino_UNO_R4_Minima_37041A20373331392E0333324B572D48-if00
lib_deps = adafruit/Adafruit PWM Servo Driver Library@^3.0.3